name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scientific
          POSTGRES_USER: scientific
          POSTGRES_PASSWORD: scientific
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scientific -d scientific"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://scientific:scientific@localhost:5432/scientific
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
      - run: sci-discover validate data/sample_datasets.jsonl
      - run: sci-discover ingest data/sample_datasets.jsonl
      - run: sci-discover evaluate --k 5
