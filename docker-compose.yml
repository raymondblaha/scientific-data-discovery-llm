services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scientific
      POSTGRES_USER: scientific
      POSTGRES_PASSWORD: scientific
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scientific -d scientific"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
