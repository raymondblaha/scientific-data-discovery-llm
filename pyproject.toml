[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-data-discovery"
version = "0.1.0"
description = "Reproducible scientific metadata ingestion and evaluated keyword retrieval"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4", "pydantic>=2.9,<3", "typer>=0.12,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.7,<1"]

[project.scripts]
sci-discover = "scientific_discovery.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
